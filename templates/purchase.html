<!DOCTYPE html>
<html>

<head>

<title>Procurement Invoice</title>

<meta name="viewport" content="width=device-width, initial-scale=1">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}


body{

background:linear-gradient(135deg,#020617,#0f172a,#052e16);

min-height:100vh;

color:white;

}



.container{

padding:20px;

}



.header{

background:#0f172a;

padding:20px;

border-radius:18px;

border:1px solid #22c55e;

box-shadow:0 0 20px #22c55e;

}



.header h1{

color:#22c55e;

text-shadow:0 0 10px #22c55e;

}



.back{

display:inline-block;

margin-top:15px;

padding:10px 18px;

background:#06b6d4;

color:#020617;

border-radius:10px;

text-decoration:none;

font-weight:bold;

}




.card{

margin-top:20px;

padding:20px;

background:#0f172a;

border-radius:20px;

border:1px solid #06b6d4;

box-shadow:0 0 25px rgba(6,182,212,.5);

}




input{

width:100%;

padding:12px;

margin:5px 0;

border-radius:10px;

background:#020617;

border:1px solid #334155;

color:white;

font-size:15px;

}



input:focus{

outline:none;

border-color:#22c55e;

box-shadow:0 0 10px #22c55e;

}




.table-box{

overflow-x:auto;

}



table{

width:100%;

margin-top:20px;

border-collapse:collapse;

}



th{

background:#22c55e;

color:#022c22;

padding:12px;

}



td{

border:1px solid #334155;

padding:8px;

}



td input{

min-width:120px;

}




.btn{

margin-top:15px;

padding:13px 20px;

border:none;

border-radius:12px;

font-weight:bold;

cursor:pointer;

}



.add{

background:#06b6d4;

box-shadow:0 0 15px #06b6d4;

}



.generate{

background:#22c55e;

box-shadow:0 0 15px #22c55e;

}



.remove{

background:#ef4444;

color:white;

border:none;

padding:10px;

border-radius:8px;

}



</style>


</head>


<body>


<div class="container">


<div class="header">

<h1>
🧾 Procurement Invoice
</h1>


<a href="/dashboard" class="back">
← Dashboard
</a>


</div>




<form method="POST" action="/purchase">



<div class="card">


<label>
Supplier Name
</label>


<input 
type="text"
name="supplier"
placeholder="Supplier Name">





<div class="table-box">


<table id="medicineTable">


<tr>

<th>Product</th>

<th>Qty</th>

<th>Unit Price</th>

<th>MRP</th>

<th>Remove</th>

</tr>



<tr>


<td>

<input 
name="product[]"
placeholder="Medicine">

</td>



<td>

<input 
name="qty[]"
type="number"
step="1">

</td>



<td>

<input 
name="price[]"
type="number"
step="0.01"
placeholder="Unit Price">

</td>



<td>

<input 
name="mrp[]"
type="number"
step="0.01"
placeholder="MRP">

</td>




<td>

<button 
type="button"
class="remove"
onclick="removeRow(this)">

❌

</button>

</td>


</tr>



</table>


</div>





<button 
type="button"
class="btn add"
onclick="addMedicine()">

➕ Add Medicine

</button>




<br>



<button 
type="submit"
class="btn generate">

🧾 Generate Invoice

</button>



</div>



</form>



</div>






<script>


function addMedicine(){


let table=document.getElementById("medicineTable");


let row=table.insertRow(-1);



row.innerHTML=`

<td>

<input 
name="product[]"
placeholder="Medicine">

</td>


<td>

<input 
name="qty[]"
type="number"
step="1">

</td>



<td>

<input 
name="price[]"
type="number"
step="0.01"
placeholder="Unit Price">

</td>



<td>

<input 
name="mrp[]"
type="number"
step="0.01"
placeholder="MRP">

</td>



<td>

<button 
type="button"
class="remove"
onclick="removeRow(this)">

❌

</button>


</td>

`;

}



function removeRow(btn){

let row=btn.parentElement.parentElement;

row.remove();

}



</script>



</body>

</html>
