<!DOCTYPE html>
<html>
<head>
<title>Medicine RMS Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#020617,#064e3b);
}


.login-box{

    width:330px;
    padding:35px;

    background:#0f172a;

    border-radius:20px;

    border:2px solid #22c55e;

    box-shadow:0 0 30px #22c55e;

    text-align:center;

}


.logo{
    font-size:50px;
}


h1{
    color:#22c55e;
    margin:15px 0 25px;
}


input{

    width:100%;

    padding:12px;

    margin:10px 0;

    background:#020617;

    border:1px solid #475569;

    border-radius:10px;

    color:white;

}


button{

    width:100%;

    padding:12px;

    margin-top:15px;

    border:none;

    border-radius:10px;

    background:#22c55e;

    font-weight:bold;

    color:#022c22;

}


</style>

</head>


<body>


<div class="login-box">

<div class="logo">💊</div>

<h1>Medicine RMS</h1>


<form method="POST">

<input type="text" name="username" placeholder="Username">

<input type="password" name="password" placeholder="Password">


<button type="submit">
Login
</button>

</form>


</div>


</body>
</html>
