<!DOCTYPE html>
<html>

<head>

<title>Sales Invoice</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:15px;
    background:#f1f5f9;
    font-family:Arial,sans-serif;
    color:#111827;
}

.container{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

h2{
    margin-top:0;
}

hr{
    border:0;
    border-top:1px solid #ddd;
    margin:20px 0;
}

input{
    padding:10px;
    border:1px solid #aaa;
    border-radius:5px;
    margin:5px;
}

.customer-box{
    display:flex;
    flex-wrap:wrap;
}

.customer-box input{
    flex:1;
    min-width:200px;
}

.add-box{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
}

.add-box input{
    flex:1;
    min-width:130px;
}

button{
    cursor:pointer;
}

.add-btn{
    background:#16a34a;
    color:white;
    border:0;
    padding:11px 18px;
    border-radius:5px;
    margin:5px;
}

.back-btn{
    background:#475569;
    color:white;
    border:0;
    padding:10px 18px;
    border-radius:5px;
}

.create-btn{
    background:#2563eb;
    color:white;
    border:0;
    padding:12px 20px;
    border-radius:6px;
    font-size:16px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#1e293b;
    color:white;
    padding:12px;
}

td{
    border-bottom:1px solid #ddd;
    padding:9px;
    text-align:center;
}

.qty-input{
    width:70px;
}

.price-input{
    width:100px;
}

.remove-btn{
    background:#ef4444;
    color:white;
    border:0;
    padding:7px 12px;
    border-radius:5px;
}

.summary{
    max-width:400px;
    margin-left:auto;
    margin-top:20px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:7px;
}

.summary-row input{
    width:130px;
}

.payable{
    border-top:2px solid #111;
    font-size:20px;
    font-weight:bold;
}

</style>

</head>


<body>


<div class="container">


<h2>🧾 Sales Invoice</h2>


<a href="/dashboard">

<button
    type="button"
    class="back-btn"
>
    ⬅ Dashboard
</button>

</a>


<hr>


<h3>👤 Customer Information</h3>


<div class="customer-box">


<input
    type="text"
    id="customer_name"
    placeholder="Customer Name"
    value="Walk-in Customer"
>


<input
    type="text"
    id="location"
    placeholder="Location / Address"
>


<input
    type="text"
    id="phone"
    placeholder="Phone Number"
>


</div>


<hr>


<h3>💊 Add Medicine</h3>


<p>
Medicine database থেকে নেওয়ার দরকার নেই।
নিজে Medicine Name লিখে Add করুন।
</p>


<div class="add-box">


<input
    type="text"
    id="medicineName"
    placeholder="Medicine Name"
>


<input
    type="number"
    id="medicineQty"
    placeholder="Qty"
    value="1"
    min="1"
>


<input
    type="number"
    id="medicinePrice"
    placeholder="Price"
    min="0"
    step="0.01"
>


<button
    type="button"
    class="add-btn"
    onclick="addMedicine()"
>
    ➕ Add Medicine
</button>


</div>


<table>


<thead>

<tr>

<th>S.No.</th>

<th>Medicine</th>

<th>Qty</th>

<th>Price</th>

<th>Amount</th>

<th>Action</th>

</tr>

</thead>


<tbody id="cartBody"></tbody>


</table>


<div class="summary">


<div class="summary-row">

<span>Total Tk.</span>

<strong id="total">
0.00
</strong>

</div>


<div class="summary-row">

<span>Discount %</span>

<input
    type="number"
    id="discount"
    value="0"
    min="0"
    max="100"
    step="0.01"
    oninput="calculate()"
>

</div>


<div class="summary-row">

<span>Discount Tk.</span>

<strong id="discountAmount">
0.00
</strong>

</div>


<div class="summary-row payable">

<span>Payable Tk.</span>

<strong id="payable">
0.00
</strong>

</div>


<div class="summary-row">

<span>Received Tk.</span>

<input
    type="number"
    id="received"
    value="0"
    min="0"
    step="0.01"
    oninput="calculate()"
>

</div>


<div class="summary-row">

<span>Due Tk.</span>

<strong id="due">
0.00
</strong>

</div>


</div>


<br>


<form
    method="POST"
    action="/sales_invoice"
    id="invoiceForm"
>


<input
    type="hidden"
    name="customer_name"
    id="formCustomer"
>


<input
    type="hidden"
    name="location"
    id="formLocation"
>


<input
    type="hidden"
    name="phone"
    id="formPhone"
>


<input
    type="hidden"
    name="discount_percent"
    id="formDiscount"
>


<input
    type="hidden"
    name="received"
    id="formReceived"
>


<div id="hiddenProducts"></div>


<button
    type="submit"
    class="create-btn"
>
    🧾 Create Sales Invoice
</button>


</form>


</div>


<script>


let cart = [];


function addMedicine(){


    let name =
        document.getElementById(
            "medicineName"
        ).value.trim();


    let qty =
        parseFloat(
            document.getElementById(
                "medicineQty"
            ).value
        );


    let price =
        parseFloat(
            document.getElementById(
                "medicinePrice"
            ).value
        );


    if(!name){

        alert("Medicine Name দিন");

        return;

    }


    if(!qty || qty <= 0){

        alert("Valid Quantity দিন");

        return;

    }


    if(isNaN(price) || price < 0){

        alert("Valid Price দিন");

        return;

    }


    cart.push({

        name:name,

        qty:qty,

        price:price

    });


    document.getElementById(
        "medicineName"
    ).value = "";


    document.getElementById(
        "medicineQty"
    ).value = "1";


    document.getElementById(
        "medicinePrice"
    ).value = "";


    renderCart();

}


function renderCart(){


    let body =
        document.getElementById(
            "cartBody"
        );


    body.innerHTML = "";


    cart.forEach(
        function(item,index){


            let amount =
                item.qty * item.price;


            let row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${index + 1}
                </td>

                <td>
                    ${escapeHtml(item.name)}
                </td>

                <td>

                    <input
                        class="qty-input"
                        type="number"
                        min="1"
                        value="${item.qty}"
                        onchange="changeQty(${index},this.value)"
                    >

                </td>

                <td>

                    <input
                        class="price-input"
                        type="number"
                        min="0"
                        step="0.01"
                        value="${item.price}"
                        onchange="changePrice(${index},this.value)"
                    >

                </td>

                <td>
                    ${amount.toFixed(2)}
                </td>

                <td>

                    <button
                        type="button"
                        class="remove-btn"
                        onclick="removeMedicine(${index})"
                    >
                        ❌
                    </button>

                </td>

            `;


            body.appendChild(row);

        }
    );


    calculate();

}


function changeQty(index,value){

    let qty =
        parseFloat(value);


    if(!qty || qty <= 0){

        qty = 1;

    }


    cart[index].qty = qty;


    renderCart();

}


function changePrice(index,value){

    let price =
        parseFloat(value);


    if(isNaN(price) || price < 0){

        price = 0;

    }


    cart[index].price = price;


    renderCart();

}


function removeMedicine(index){

    cart.splice(index,1);

    renderCart();

}


function calculate(){


    let total = 0;


    cart.forEach(
        function(item){

            total +=
                item.qty * item.price;

        }
    );


    let discountPercent =
        parseFloat(
            document.getElementById(
                "discount"
            ).value
        ) || 0;


    let discountAmount =
        total * discountPercent / 100;


    let payable =
        total - discountAmount;


    let received =
        parseFloat(
            document.getElementById(
                "received"
            ).value
        ) || 0;


    let due =
        payable - received;


    document.getElementById(
        "total"
    ).innerText =
        total.toFixed(2);


    document.getElementById(
        "discountAmount"
    ).innerText =
        discountAmount.toFixed(2);


    document.getElementById(
        "payable"
    ).innerText =
        payable.toFixed(2);


    document.getElementById(
        "due"
    ).innerText =
        due.toFixed(2);

}


document.getElementById(
    "invoiceForm"
).addEventListener(
    "submit",
    function(event){


        if(cart.length === 0){

            event.preventDefault();

            alert(
                "কমপক্ষে একটি Medicine Add করুন।"
            );

            return;

        }


        document.getElementById(
            "formCustomer"
        ).value =
            document.getElementById(
                "customer_name"
            ).value;


        document.getElementById(
            "formLocation"
        ).value =
            document.getElementById(
                "location"
            ).value;


        document.getElementById(
            "formPhone"
        ).value =
            document.getElementById(
                "phone"
            ).value;


        document.getElementById(
            "formDiscount"
        ).value =
            document.getElementById(
                "discount"
            ).value;


        document.getElementById(
            "formReceived"
        ).value =
            document.getElementById(
                "received"
            ).value;


        let hidden =
            document.getElementById(
                "hiddenProducts"
            );


        hidden.innerHTML = "";


        cart.forEach(
            function(item){


                hidden.innerHTML += `

                    <input
                        type="hidden"
                        name="product_name[]"
                        value="${escapeAttribute(item.name)}"
                    >

                    <input
                        type="hidden"
                        name="qty[]"
                        value="${item.qty}"
                    >

                    <input
                        type="hidden"
                        name="price[]"
                        value="${item.price}"
                    >

                `;

            }
        );


    }
);


function escapeHtml(text){

    let div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


function escapeAttribute(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}


</script>


</body>

</html>
